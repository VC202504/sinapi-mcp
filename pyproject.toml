[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sinapi-mcp"
version = "0.1.0"
description = "Servidor MCP com os preços oficiais de obras do Brasil (SINAPI, SICRO, ORSE e SEINFRA) para Claude e outros assistentes de IA"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kenyo Veloso Chianca" }]
keywords = ["mcp", "sinapi", "sicro", "orse", "seinfra", "orcamento", "engenharia", "construcao", "bdi", "claude", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["mcp>=1.10"]

[project.optional-dependencies]
sicro = ["py7zr>=0.21"]
dev = ["pytest>=8"]

[project.scripts]
sinapi-mcp = "sinapi_mcp.cli:main"

[project.urls]
Repository = "https://github.com/VC202504/sinapi-mcp"
Issues = "https://github.com/VC202504/sinapi-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sinapi_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
